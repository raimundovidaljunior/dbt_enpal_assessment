
name: 'enpal_assessment_project'
version: '1.0.0'

profile: 'enpal_assessment_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  enpal_assessment_project:
    +schema: pipedrive_analytics
    +materialized: table
    preparation:
      +materialized: view
      +schema: preparation_pipedrive
    intermediate:
      +materialized: view
      +schema: intermediate_crm
    marts:
      +schema: marts_crm
    reporting:
      +schema: reporting_crm

seeds:
  enpal_assessment_project:
    +schema: intermediate_crm
    funnel_steps:
      +column_types:
        funnel_step: varchar(10)
        source_value: varchar(50)
