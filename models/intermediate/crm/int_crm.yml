version: 2

models:
  - name: int_crm__deal_stage_entries
    description: >
      One row per actual stage entry of a deal (one per stage_id change in the source).
      Skipped stages are not included here; see int_crm__deal_stage_entries_inferred.

      Known limitation: 5 deal_ids (e.g. 399956, 554294) have two add_time events with
      parallel, overlapping stage histories (cause unknown). They are treated as one deal,
      so their previous_stage_id and inferred rows can be off. What they represent needs
      to be clarified with business stakeholders before modelling around it.

      Materialized as a table (an exception to the intermediate views): fct_funnel_events reads
      it directly and through int_crm__deal_stage_entries_inferred, so as a view its window
      function would run twice per build of the funnel.
    config:
      materialized: table
    columns:
      - name: deal_stage_entry_id
        description: Surrogate key (deal, stage, entered_at).
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: Pipedrive deal id.
        data_tests:
          - not_null
      - name: stage_id
        description: Stage the deal entered.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('prep_pipedrive__stages')
                field: stage_id
      - name: stage_name
        description: Name of the stage from prep_pipedrive__stages.
      - name: previous_stage_id
        description: Stage the deal was in before this entry (null for the first entry).
      - name: entered_at
        description: Timestamp the deal entered the stage.
        data_tests:
          - not_null

  - name: int_crm__deal_stage_entries_inferred
    description: >
      Stages a deal skipped while moving forward, counted as entered following the
      Pipedrive Insights convention (a move from stage 2 to 5 counts as entering 3, 4
      and 5). Contains only the generated rows; they take the timestamp of the stage
      actually reached. Backward moves produce no rows.
    columns:
      - name: deal_stage_entry_id
        description: Surrogate key (deal, stage, entered_at, 'inferred').
        data_tests:
          - unique
          - not_null
      - name: deal_id
        description: Pipedrive deal id.
        data_tests:
          - not_null
      - name: stage_id
        description: Skipped stage counted as entered.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('prep_pipedrive__stages')
                field: stage_id
      - name: stage_name
        description: Name of the stage from prep_pipedrive__stages.
      - name: reached_stage_id
        description: Stage actually entered that caused this stage to be inferred.
      - name: entered_at
        description: Timestamp of the actual entry into reached_stage_id.
        data_tests:
          - not_null

  - name: int_crm__sales_calls
    description: >
      Sales call activities (Sales Call 1 = meeting, Sales Call 2 = sc_2), done or not.
      activity_id is not unique, as in the source.
    columns:
      - name: sales_call_id
        description: Surrogate key over all columns (activity_id is not unique in the source).
        data_tests:
          - unique
          - not_null
      - name: activity_id
        description: Pipedrive activity id.
      - name: deal_id
        description: Deal the activity belongs to.
        data_tests:
          - not_null
      - name: assigned_user_id
        description: User the activity is assigned to.
      - name: activity_type
        description: Activity type code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['meeting', 'sc_2']
      - name: activity_type_name
        description: Activity type display name.
      - name: is_done
        description: Whether the call was completed.
      - name: due_at
        description: Due timestamp of the call, used as the event date.
        data_tests:
          - not_null

unit_tests:
  - name: deal_stage_entries_orders_by_time_and_keeps_stage_changes_only
    description: previous_stage_id follows changed_at (not input order); other fields are ignored.
    model: int_crm__deal_stage_entries
    given:
      - input: ref('prep_pipedrive__deal_changes')
        rows:
          - {deal_id: 10, changed_at: '2024-01-03 00:00:00', changed_field_key: stage_id, new_value: '3'}
          - {deal_id: 10, changed_at: '2024-01-01 00:00:00', changed_field_key: stage_id, new_value: '1'}
          - {deal_id: 10, changed_at: '2024-01-02 00:00:00', changed_field_key: user_id, new_value: '99'}
          - {deal_id: 10, changed_at: '2024-01-02 12:00:00', changed_field_key: stage_id, new_value: '2'}
      - input: ref('prep_pipedrive__stages')
        rows:
          - {stage_id: 1, stage_name: Lead Generation}
          - {stage_id: 2, stage_name: Qualified lead}
          - {stage_id: 3, stage_name: Needs Assessment}
    expect:
      rows:
        - {deal_id: 10, stage_id: 1, previous_stage_id: null}
        - {deal_id: 10, stage_id: 2, previous_stage_id: 1}
        - {deal_id: 10, stage_id: 3, previous_stage_id: 2}

  - name: inferred_stages_fill_forward_skips
    description: A 1 -> 3 -> 5 path infers stage 2 (reached at 3) and stage 4 (reached at 5).
    model: int_crm__deal_stage_entries_inferred
    given:
      - input: ref('int_crm__deal_stage_entries')
        rows:
          - {deal_id: 1, stage_id: 1, previous_stage_id: null, entered_at: '2024-01-01 00:00:00'}
          - {deal_id: 1, stage_id: 3, previous_stage_id: 1, entered_at: '2024-01-10 00:00:00'}
          - {deal_id: 1, stage_id: 5, previous_stage_id: 3, entered_at: '2024-02-01 00:00:00'}
      - input: ref('prep_pipedrive__stages')
        rows:
          - {stage_id: 2, stage_name: Qualified lead}
          - {stage_id: 4, stage_name: Proposal/Quote Preparation}
    expect:
      rows:
        - {deal_id: 1, stage_id: 2, reached_stage_id: 3, entered_at: '2024-01-10 00:00:00'}
        - {deal_id: 1, stage_id: 4, reached_stage_id: 5, entered_at: '2024-02-01 00:00:00'}

  - name: inferred_stages_ignore_backward_and_adjacent_moves
    description: Adjacent moves (1 -> 2 -> 3), backward moves (3 -> 2) and a single stage infer nothing.
    model: int_crm__deal_stage_entries_inferred
    given:
      - input: ref('int_crm__deal_stage_entries')
        rows:
          - {deal_id: 2, stage_id: 1, previous_stage_id: null, entered_at: '2024-01-01 00:00:00'}
          - {deal_id: 2, stage_id: 2, previous_stage_id: 1, entered_at: '2024-01-02 00:00:00'}
          - {deal_id: 2, stage_id: 3, previous_stage_id: 2, entered_at: '2024-01-03 00:00:00'}
          - {deal_id: 2, stage_id: 2, previous_stage_id: 3, entered_at: '2024-01-04 00:00:00'}
          - {deal_id: 3, stage_id: 1, previous_stage_id: null, entered_at: '2024-01-01 00:00:00'}
      - input: ref('prep_pipedrive__stages')
        rows:
          - {stage_id: 1, stage_name: Lead Generation}
    expect:
      rows: []
