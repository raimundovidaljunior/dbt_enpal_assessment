version: 2

models:
  - name: prep_pipedrive__deal_changes
    description: One row per change of a deal field, renamed from the deal_changes source.
    columns:
      - name: deal_id
        description: '{{ doc("deal_id") }}'
        data_tests:
          - not_null
      - name: changed_at
        description: Timestamp when the field changed.
        data_tests:
          - not_null
      - name: changed_field_key
        description: Key of the changed field (add_time, stage_id, user_id, lost_reason).
        data_tests:
          - not_null
      - name: new_value
        description: New value of the field as text; its type depends on changed_field_key.

  - name: prep_pipedrive__activity
    description: One row per activity, renamed from the activity source. activity_id is not unique in the raw data.
    columns:
      - name: activity_id
        description: '{{ doc("activity_id") }}'
        data_tests:
          - not_null
      - name: activity_type
        description: Activity type code, joins to prep_pipedrive__activity_types.activity_type.
      - name: assigned_user_id
        description: '{{ doc("assigned_user_id") }}'
      - name: deal_id
        description: '{{ doc("activity_deal_id") }}'
      - name: is_done
        description: Whether the activity was completed.
      - name: due_at
        description: Due timestamp of the activity.

  - name: prep_pipedrive__activity_types
    description: Lookup of activity types.
    columns:
      - name: activity_type_id
        description: Activity type id.
        data_tests:
          - unique
          - not_null
      - name: activity_type_name
        description: Activity type display name (e.g. Sales Call 1).
      - name: is_active
        description: Whether the activity type is active.
      - name: activity_type
        description: Activity type code, referenced by prep_pipedrive__activity.activity_type.

  - name: prep_pipedrive__stages
    description: Lookup of deal pipeline stages.
    columns:
      - name: stage_id
        description: Stage id.
        data_tests:
          - unique
          - not_null
      - name: stage_name
        description: '{{ doc("stage_name") }}'

  - name: prep_pipedrive__users
    description: Pipedrive users (deal owners and activity assignees).
    columns:
      - name: user_id
        description: '{{ doc("user_id") }}'
        data_tests:
          - unique
          - not_null
      - name: user_name
        description: '{{ doc("user_name") }}'
      - name: email
        description: '{{ doc("email") }}'
      - name: modified_at
        description: '{{ doc("modified_at") }}'

  - name: prep_pipedrive__lost_reasons
    description: Lost reason options, exploded from the lost_reason entry of the fields source (field_value_options JSONB).
    columns:
      - name: lost_reason_id
        description: Lost reason id, referenced by deal_changes.new_value when changed_field_key = 'lost_reason'.
        data_tests:
          - unique
          - not_null
      - name: lost_reason_name
        description: '{{ doc("lost_reason_name") }}'
        data_tests:
          - not_null
