version: 2

seeds:
  - name: funnel_steps
    description: >
      Definition of the sales funnel steps reported in rep_sales_funnel_monthly,
      and the CRM event each step is derived from (a deal stage or an activity type).
      It is the report contract (README numbering and names), so it is maintained by hand;
      the not_null tests on dim_deal_stages fail if a pipeline stage has no row here.
    columns:
      - name: funnel_step
        description: Funnel step number as text (e.g. '2.1').
        data_tests:
          - unique
          - not_null
      - name: kpi_name
        description: Display name of the funnel step.
        data_tests:
          - unique
          - not_null
      - name: source_type
        description: Where the step comes from ('stage' or 'activity').
        data_tests:
          - accepted_values:
              arguments:
                values: ['stage', 'activity']
      - name: source_value
        description: stage_id (for stage) or activity_type code (for activity).
      - name: sort_order
        description: Ordering of the steps in the funnel.
        data_tests:
          - unique
          - not_null
