version: 2

seeds:
  - name: funnel_steps
    description: >
      Definition of the sales funnel steps reported in rep_sales_funnel_monthly,
      and the CRM event each step is derived from (a deal stage or an activity type).
      It is the report contract (README numbering and names), so it is maintained by hand;
      the not_null tests on dim_deal_stages fail if a pipeline stage has no row here. Its
      activity rows also define which activity types count as sales calls
      (int_crm__sales_calls filters on them).
    columns:
      - name: funnel_step
        description: '{{ doc("funnel_step") }}'
        data_tests:
          - unique
          - not_null
      - name: kpi_name
        description: '{{ doc("kpi_name") }}'
        data_tests:
          - unique
          - not_null
      - name: source_type
        description: Where the step comes from ('stage' or 'activity').
        data_tests:
          - accepted_values:
              arguments:
                values: ['stage', 'activity']
      - name: source_value
        description: >
          stage_id (for stage) or activity_type code (for activity). Unique, so joining the
          seed on it never duplicates events.
        data_tests:
          - unique
          - not_null
      - name: sort_order
        description: '{{ doc("sort_order") }}'
        data_tests:
          - unique
          - not_null
